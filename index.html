<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lewis Escalante | DRL Express</title>
<meta property="og:title" content="Lewis Escalante — CEO, DRL Express & Logística">
<meta property="og:description" content="Contacta a Lewis Escalante directamente.">
<meta property="og:image" content="https://bio.drlexpresscol.com.co/lewis-preview.jpg">
<meta property="og:url" content="https://bio.drlexpresscol.com.co/">
<meta property="og:type" content="profile">
<style>
  :root{
    --navy:#1A0E45;
    --navy2:#3D1E6B;
    --fuchsia:#C81E7A;
    --orange:#F47920;
    --bg:#F4F2FA;
    --ink:#1A0E45;
    --muted:#6E6785;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    display:flex;justify-content:center;
    padding:0;
  }
  .card{
    width:100%;max-width:460px;
    background:#fff;
    min-height:100vh;
    position:relative;
  }

  /* HERO */
  .hero{
    width:100%;height:0;padding-top:128%;
    position:relative;
    background-image:url('lewis-photo.jpg');
    background-size:cover;background-position:center 20%;
  }
  .hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to top, rgba(12,6,38,0.92) 0%, rgba(12,6,38,0.55) 28%, rgba(12,6,38,0.05) 55%, rgba(12,6,38,0) 65%);
  }
  .share-btn{
    position:absolute;top:1.2rem;right:1.2rem;z-index:3;
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,0.92);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    border:none;cursor:pointer;
  }
  .share-btn svg{width:19px;height:19px;}

  .brand-badge{
    position:absolute;top:1.2rem;left:1.2rem;z-index:3;
    background:rgba(12,6,38,0.55);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:12px;
    padding:8px 12px;
    display:flex;align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .brand-badge img{height:26px;display:block;}

  .hero-text{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 1.6rem 1.5rem;text-align:center;}
  .hero-text .name{
    font-size:32px;font-weight:800;color:#fff;letter-spacing:-0.5px;
    text-shadow:0 3px 16px rgba(0,0,0,0.5);line-height:1.1;
  }
  .hero-text .company-tag{
    margin-top:0.5rem;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    backdrop-filter:blur(6px);
    padding:5px 14px;border-radius:999px;
    font-size:12px;font-weight:700;color:#fff;letter-spacing:0.5px;text-transform:uppercase;
  }

  /* ROLE BAND */
  .role-band{
    text-align:center;
    padding:1.5rem 1.5rem 0.4rem;
  }
  .role-band .role{
    font-size:20px;font-weight:800;color:var(--ink);
  }
  .role-band .sub{
    margin-top:0.3rem;font-size:14px;color:var(--muted);font-weight:500;
  }

  /* ICON GRID */
  .grid{
    display:flex;flex-wrap:wrap;
    padding:1.8rem 0.9rem 1rem;
  }
  .item{
    display:flex;flex-direction:column;align-items:center;
    text-decoration:none;
    width:33.333%;
    padding:0 0.5rem;
    margin-bottom:1.6rem;
  }
  .item .icon-box{margin-bottom:0.55rem;}
  .icon-box{
    width:60px;height:60px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(26,14,69,0.18);
  }
  .icon-box svg{width:28px;height:28px;}
  .item span{
    font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;
  }
  .bg-whatsapp{background:linear-gradient(135deg,#25D366,#128C3E);}
  .bg-web{background:linear-gradient(135deg,var(--navy2),var(--navy));}
  .bg-mail{background:linear-gradient(135deg,#F47920,#D9530C);}
  .bg-phone{background:linear-gradient(135deg,#2AB673,#0E8B54);}
  .bg-ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);}
  .bg-fb{background:linear-gradient(135deg,#1877F2,#0E4FA8);}

  /* SAVE BUTTON */
  .save-wrap{padding:0.6rem 1.4rem 1.6rem;}
  .save-btn{
    display:block;width:100%;text-align:center;
    background:linear-gradient(135deg,var(--fuchsia),var(--navy2));
    color:#fff;font-weight:800;font-size:15px;
    padding:15px;border-radius:14px;text-decoration:none;
    box-shadow:0 8px 20px rgba(200,30,122,0.3);
  }

  /* FOOTER */
  .footer{
    text-align:center;padding:1rem 1rem 2.2rem;
  }
  .footer img{height:26px;opacity:0.9;}
  .footer .tag{margin-top:0.4rem;font-size:11px;color:var(--muted);letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="card">

  <div class="hero">
    <div class="brand-badge">
      <img src="logo.png" alt="DRL Express">
    </div>
    <button class="share-btn" onclick="shareCard()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A0E45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
        <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
      </svg>
    </button>
    <div class="hero-text">
      <div class="name">Lewis Escalante</div>
      <div class="company-tag">DRL Express &amp; Logística</div>
    </div>
  </div>

  <div class="role-band">
    <div class="role">CEO</div>
    <div class="sub">Grupo DRL — Bogotá, Colombia</div>
  </div>

  <div class="grid">
    <a class="item" href="https://wa.me/573156998220" target="_blank">

      </div>
      <span>WhatsApp</span>
    </a>
    <a class="item" href="https://www.drlexpresscol.com.co/" target="_blank">
      <div class="icon-box bg-web">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path>
          <path d="M12 3c2.4 2.6 3.6 5.7 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.7-3.6-9s1.2-6.4 3.6-9z"></path>
        </svg>
      </div>
      <span>Sitio web</span>
    </a>
    <a class="item" href="mailto:gerenciacomercial@drlexpresscol.com.co">
      <div class="icon-box bg-mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path>
        </svg>
      </div>
      <span>Correo</span>
    </a>
    <a class="item" href="tel:+573156998220">
      <div class="icon-box bg-phone">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>
      </div>
      <span>Teléfono</span>

    <a class="item" href="https://instagram.com/drlexpresscolombia/" target="_blank">
      <div class="icon-box bg-ig">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1"></circle></svg>

    <a class="item" href="https://www.facebook.com/profile.php?id=61561028465696" target="_blank">
      <div class="icon-box bg-fb">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 21v-7.6h2.55l.38-2.96h-2.93V8.53c0-.86.24-1.44 1.47-1.44h1.57V4.44C16.2 4.4 15.3 4.32 14.26 4.32c-2.17 0-3.66 1.32-3.66 3.75v2.37H8.05v2.96h2.55V21h2.9z"/></svg>
      </div>
      <span>Facebook</span>
    </a>
  </div>

  <div class="save-wrap">
    <a class="save-btn" href="https://wa.me/573156998220?text=Hola%20Lewis" target="_blank">Escribir por WhatsApp</a>
  </div>

  <div class="footer">
    <img src="logo.png" alt="DRL Express">
    <div class="tag">DRL EXPRESS &amp; LOGÍSTICA</div>
  </div>

</div>

<script>
function shareCard(){
  const url = "https://bio.drlexpresscol.com.co/";
  const shareData = { title: "Lewis Escalante — DRL Express", text: "Contacta a Lewis Escalante", url: url };
  if (navigator.share) {
    navigator.share(shareData).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>{ alert("Link copiado: " + url); });
  }
}
</script>
</body>
</html>
