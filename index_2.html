<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lewis Escalante | DRL Express</title>
<meta property="og:title" content="Lewis Escalante — Gerente Comercial de Ventas, DRL Express & Logística">
<meta property="og:description" content="Contacta a Lewis Escalante directamente.">
<meta property="og:image" content="https://equipo.drlexpresscol.com.co/lewis/lewis-photo.jpg">
<meta property="og:url" content="https://equipo.drlexpresscol.com.co/lewis/">
<meta property="og:type" content="profile">
<style>
  :root{
    --navy:#1A0E45;
    --navy2:#3D1E6B;
    --fuchsia:#C81E7A;
    --orange:#F47920;
    --bg:#F4F2FA;
    --ink:#1A0E45;
    --muted:#6E6785;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    display:flex;justify-content:center;
    padding:0;
  }
  .card{
    width:100%;max-width:460px;
    background:#fff;
    min-height:100vh;
    position:relative;
  }

  /* HERO */
  .hero{
    width:100%;height:0;padding-top:128%;
    position:relative;
    background-image:url('lewis-photo.jpg');
    background-size:cover;background-position:center 15%;
  }
  .hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to top, rgba(12,6,38,0.92) 0%, rgba(12,6,38,0.55) 28%, rgba(12,6,38,0.05) 55%, rgba(12,6,38,0) 65%);
  }
  .share-btn{
    position:absolute;top:1.2rem;right:1.2rem;z-index:3;
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,0.92);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    border:none;cursor:pointer;
  }
  .share-btn svg{width:19px;height:19px;}

  .brand-badge{
    position:absolute;top:1.2rem;left:1.2rem;z-index:3;
    background:rgba(12,6,38,0.55);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:12px;
    padding:8px 12px;
    display:flex;align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .brand-badge img{height:26px;display:block;}

  .hero-text{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 1.6rem 1.5rem;text-align:center;}
  .hero-text .name{
    font-size:32px;font-weight:800;color:#fff;letter-spacing:-0.5px;
    text-shadow:0 3px 16px rgba(0,0,0,0.5);line-height:1.1;
  }
  .hero-text .company-tag{
    margin-top:0.5rem;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    backdrop-filter:blur(6px);
    padding:5px 14px;border-radius:999px;
    font-size:12px;font-weight:700;color:#fff;letter-spacing:0.5px;text-transform:uppercase;
  }

  /* ROLE BAND */
  .role-band{
    text-align:center;
    padding:1.5rem 1.5rem 0.4rem;
  }
  .role-band .role{
    font-size:20px;font-weight:800;color:var(--ink);
  }
  .role-band .sub{
    margin-top:0.3rem;font-size:13px;color:var(--muted);
  }

  /* CONTACT LIST */
  .list{padding:1.4rem 1.6rem 1rem;}
  .item{
    display:flex;align-items:center;gap:14px;
    padding:13px 14px;
    border-radius:14px;
    background:var(--bg);
    text-decoration:none;
    margin-bottom:10px;
  }
  .item .icon{
    width:38px;height:38px;border-radius:10px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 1px 4px rgba(26,14,69,0.12);
  }
  .item .icon svg{width:18px;height:18px;}
  .item .label{font-weight:700;color:var(--ink);font-size:14px;}
  .item .value{font-size:12px;color:var(--muted);}

  .save-btn{
    display:block;margin:0.4rem 1.6rem 2rem;
    background:linear-gradient(135deg,var(--fuchsia),var(--orange));
    color:#fff;text-align:center;text-decoration:none;
    font-weight:800;font-size:15px;letter-spacing:0.2px;
    padding:16px;border-radius:16px;
    box-shadow:0 8px 20px rgba(200,30,122,0.35);
  }
</style>
</head>
<body>
  <div class="card">

        </div>

      </a>

      <a class="item" href="https://instagram.com/drlexpresscolombia/" target="_blank">

        <div>
          <div class="label">Facebook</div>
          <div class="value">DRL Express &amp; Logística</div>

      </a>
    </div>

    <a class="save-btn" href="https://wa.me/573013963083?text=Hola%20Lewis" target="_blank">Escribir por WhatsApp</a>
  </div>

  <script>
    function shareCard(){
      const shareData = {
        title: 'Lewis Escalante | DRL Express',
        text: 'Contacta a Lewis Escalante — DRL Express & Logística',
        url: 'https://equipo.drlexpresscol.com.co/lewis/'
      };
      if (navigator.share) {
        navigator.share(shareData).catch(()=>{});
      } else {
        navigator.clipboard.writeText(shareData.url);
        alert('Enlace copiado: ' + shareData.url);
      }
    }
  </script>
</body>
</html>
